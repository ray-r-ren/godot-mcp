manifest_version: 1
name: Instant Game Studio
slug: instant-game-studio
superpower: Describe a game. Get a playable Godot project, built, run and play-tested.
category: creative-media
cant_do:
  - Open the Godot editor GUI or edit interactively over a live connection between calls
  - Export to Windows, macOS, Android or iOS (Linux and Web only)
  - Download add-ons from the Godot Asset Library or fetch art and audio from the web
  - Make original art or music; starters use simple shapes and colours
  - Run C#/.NET (Mono) projects or GDExtension native code; GDScript only
  - Measure real GPU performance; rendering is software-only, so FPS numbers mean nothing
  - Godot 3.x projects (Godot 4.4 only)
example_prompts:
  - Make me a top-down game where a blue square collects coins with the arrow keys and a score shows in the corner
  - Here's my Godot project zip. Why does it crash on start? Fix it and show me a screenshot
  - "Play-test my platformer: hold right for 2 seconds, jump, and tell me if the player reaches the flag"
  - Export my game so I can play it in a browser
  - Add a pause menu to my game and check that Escape opens it
engines: []
resources:
  cpu: 4
  memory_mib: 6144
  gpu: null
  timeout_s: 900
  max_input_mb: 200
egress: []
credentials: []
agent_side: []
cost:
  typical_seconds: 15
sdk_version: 0.3.0
tools_package: tools
tools:
  - name: check_project
    title: Check a game project for errors
    kind: check
    description: "Use after any change and before running: imports the project headlessly with Godot 4.4, compiles every GDScript, loads every scene and reports missing scripts or resources, broken signal connections, a missing or bad main scene, and engine errors with file and line. Works on a state_id or an uploaded project zip. The verdict 'ready' means run_game can be tried; 'has_errors' lists what to fix with write_game_files or edit_scenes."
    input_schema:
      additionalProperties: false
      properties:
        project:
          format: skillnet-file
          type: string
          x-accept:
            - .zip
          description: A Godot 4 project zip to check (opens it and returns a state_id). Omit when passing a state_id.
        state_id:
          type: string
          description: "Continue from an earlier call's work: pass the state_id its result gave. Omit to start fresh."
      type: object
    output_schema:
      additionalProperties: false
      properties:
        verdict:
          enum:
            - ready
            - has_errors
          type: string
        errors:
          items:
            additionalProperties: false
            properties:
              file:
                type: string
              line:
                type: integer
              message:
                type: string
            required:
              - message
            type: object
          type: array
        warnings:
          items:
            additionalProperties: false
            properties:
              file:
                type: string
              line:
                type: integer
              message:
                type: string
            required:
              - message
            type: object
          type: array
        scripts_checked:
          type: integer
        scenes_checked:
          type: integer
        main_scene:
          anyOf:
            - type: string
            - type: "null"
        fixed_since_first_check:
          description: Problems an earlier check of this project reported that are gone now (file:line — message), so the whole repair can be reported.
          items:
            type: string
          type: array
      required:
        - verdict
        - errors
        - warnings
        - scripts_checked
        - scenes_checked
        - main_scene
      type: object
    long_running: false
    timeout_s: 300
    state_version: 1
  - name: create_game_project
    title: Start a new Godot game project
    kind: create
    description: "Start here when the user describes a new game. Creates a Godot 4.4 project from a starter (top_down, platformer, blank_2d, blank_3d) with a main scene, a player with movement code, coins and a score label (2D starters), input actions move_left/right/up/down, jump, pause, and the software-safe renderer, then imports and runs it headlessly to prove it starts. Returns a state_id to pass to every later call, the project zip and its file list. Next: write_game_files / edit_scenes, then check_project."
    input_schema:
      additionalProperties: false
      properties:
        name:
          description: The game's title, e.g. 'Coin Dash'. Used as the project name and window title.
          maxLength: 60
          minLength: 1
          type: string
        starter:
          default: top_down
          description: "Starting point: top_down (8-way movement, coins, score), platformer (side view with gravity, jump, ledges, coins; 'side-scroller' or 'jump and run' means platformer), blank_2d (empty 2D scene with a…"
          enum:
            - blank_2d
            - top_down
            - platformer
            - blank_3d
          type: string
        window_width:
          default: 1152
          description: Game window width in pixels.
          maximum: 3840
          minimum: 320
          type: integer
        window_height:
          default: 648
          description: Game window height in pixels.
          maximum: 2160
          minimum: 240
          type: integer
        state_id:
          type: string
          description: "Continue from an earlier call's work: pass the state_id its result gave. Omit to start fresh."
      required:
        - name
      type: object
    output_schema:
      additionalProperties: false
      properties:
        project_name:
          type: string
        starter:
          type: string
        main_scene:
          type: string
        files:
          items:
            type: string
          type: array
        input_actions:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
        starts_cleanly:
          type: boolean
        errors:
          items:
            type: object
          type: array
      required:
        - project_name
        - starter
        - main_scene
        - files
        - input_actions
        - starts_cleanly
      type: object
    long_running: false
    timeout_s: 180
    state_version: 1
  - name: edit_scenes
    title: Edit scenes and project settings
    kind: edit
    description: "Use to build or change scenes without hand-writing .tscn text; needs a state_id. Runs a batch through Godot's own scene API: create_scene, add_node, remove_node, rename_node, reparent_node, set_properties, attach_script, instantiate_scene, connect_signal, add_to_group, set_collision_layers, and project ops add_input_action, set_autoload, set_main_scene, set_setting. Stops at the first failing op and saves nothing then. Returns each op's result, the updated project zip and state_id."
    input_schema:
      additionalProperties: false
      properties:
        operations:
          description: Operations applied in order (up to 100). Nothing is saved if any operation fails.
          items:
            additionalProperties: false
            properties:
              op:
                description: The operation (see the tool description for what each needs).
                enum:
                  - create_scene
                  - add_node
                  - remove_node
                  - rename_node
                  - reparent_node
                  - set_properties
                  - attach_script
                  - instantiate_scene
                  - connect_signal
                  - add_to_group
                  - set_collision_layers
                  - add_input_action
                  - set_autoload
                  - set_main_scene
                  - set_setting
                type: string
              scene:
                type: string
                description: res:// path of the .tscn to edit (or to create / make main).
              node:
                type: string
                description: "Node path relative to the scene root ('.' is the root, 'Player/Sprite' a child). For connect_signal: the node that emits."
              parent:
                type: string
                description: Parent node path for add_node / instantiate_scene, or the new parent for reparent_node (default '.').
              target:
                type: string
                description: "connect_signal: node whose method is called (default '.', the root)."
              type:
                type: string
                description: Godot class for add_node or the root of create_scene, e.g. CharacterBody2D, Area2D, Sprite2D, Label, Timer, Node3D.
              name:
                type: string
                description: New node name (add_node, create_scene root, instantiate_scene, rename_node), input action name, or autoload name.
              properties:
                type: object
                description: "Property values: arrays become Vector2/Vector3/Color ([x,y], [x,y,z], [r,g,b,a]); colours also as '#rrggbb' or 'red'; resources as 'res://...' or {\"type\": \"RectangleShape2D\", \"size\": [32,32]}."
              script:
                type: string
                description: res:// path of a .gd script (attach_script, add_node, create_scene, set_autoload).
              child_scene:
                type: string
                description: "instantiate_scene: res:// path of the scene to place inside `scene`."
              signal:
                type: string
                description: "connect_signal: signal name, e.g. body_entered, timeout, pressed."
              method:
                type: string
                description: "connect_signal: method name on the target, e.g. _on_coin_body_entered."
              groups:
                items:
                  type: string
                type: array
                description: "add_to_group (or add_node / instantiate_scene): group names."
              layers:
                items:
                  type: integer
                type: array
                description: "set_collision_layers: layer numbers 1-32 the node is on."
              mask:
                items:
                  type: integer
                type: array
                description: "set_collision_layers: layer numbers 1-32 the node detects."
              keys:
                items:
                  type: string
                type: array
                description: "add_input_action: key names (A, Space, Enter, Escape, Left, Up, Shift...) or mouse_left / mouse_right / mouse_middle."
              remove:
                default: false
                description: "set_autoload: remove the autoload instead of adding it."
                type: boolean
              setting:
                type: string
                description: "set_setting: project setting path, e.g. display/window/size/viewport_width or physics/2d/default_gravity."
              value:
                description: "set_setting: the new value."
            required:
              - op
            type: object
          maxItems: 100
          minItems: 1
          type: array
        state_id:
          type: string
          description: "Continue from an earlier call's work: pass the state_id its result gave. Omit to start fresh."
      required:
        - operations
      type: object
    output_schema:
      additionalProperties: false
      properties:
        applied:
          type: integer
        failed_op:
          anyOf:
            - type: integer
            - type: "null"
        results:
          items:
            additionalProperties: false
            properties:
              op:
                type: string
              ok:
                type: boolean
              message:
                type: string
            required:
              - op
              - ok
              - message
            type: object
          type: array
        scenes_changed:
          items:
            type: string
          type: array
      required:
        - applied
        - failed_op
        - results
        - scenes_changed
      type: object
    long_running: false
    timeout_s: 240
    state_version: 1
  - name: export_game
    title: Export a playable Linux or Web build
    kind: export
    description: "Use when the user wants a build to play or share: exports the project with the installed Godot 4.4.1 templates to 'web' (single-threaded HTML5 build that plays from any static web host or itch.io) or 'linux' (x86_64 executable plus .pck). Checks the build files exist and, for Linux, runs the exported game headlessly for 2 seconds as a smoke test. Returns one zip of the build. Run check_project first; Windows, macOS and mobile exports are not available."
    input_schema:
      additionalProperties: false
      properties:
        project:
          format: skillnet-file
          type: string
          x-accept:
            - .zip
          description: A Godot 4 project zip to export (omit when passing a state_id).
        target:
          default: web
          description: "web: HTML5 build that plays in a browser from any static web host ('browser' or 'HTML5' means web); linux: x86_64 Linux executable plus .pck."
          enum:
            - web
            - linux
          type: string
        debug:
          default: false
          description: Export a debug build (prints errors to the console) instead of a release build.
          type: boolean
        state_id:
          type: string
          description: "Continue from an earlier call's work: pass the state_id its result gave. Omit to start fresh."
      type: object
    output_schema:
      additionalProperties: false
      properties:
        target:
          type: string
        files:
          items:
            additionalProperties: false
            properties:
              name:
                type: string
              bytes:
                type: integer
            required:
              - name
              - bytes
            type: object
          type: array
        smoke_ok:
          anyOf:
            - type: boolean
            - type: "null"
        errors:
          items:
            type: string
          type: array
      required:
        - target
        - files
        - smoke_ok
        - errors
      type: object
    long_running: true
    timeout_s: 600
    state_version: 1
  - name: inspect_project
    title: Summarise a Godot project
    kind: inspect
    description: "Use first on a Godot project the user uploads, or before play-testing, to learn its structure: Godot config version and renderer, main scene, scene trees (node names, types, scripts), each script's methods, signals and exported variables, input actions with their keys, and autoloads. `read_files` returns the full text of chosen scripts or scenes, so you can fix them without losing the user's code. Accepts a project zip (opens it and returns a state_id) or a state_id. Reads the files directly, so it also works on projects that don't compile."
    input_schema:
      additionalProperties: false
      properties:
        project:
          format: skillnet-file
          type: string
          x-accept:
            - .zip
          description: The user's Godot 4 project as a zip (opens it and returns a state_id). Omit when passing a state_id.
        detail:
          default: summary
          description: "summary: counts, scripts and actions; full: also every scene's node tree (written to project_map.json either way)."
          enum:
            - summary
            - full
          type: string
        read_files:
          description: res:// paths of text files (scripts, scenes, project.godot) whose full text to return, up to 10, e.g. ['res://scripts/main.gd']. Read a script before fixing it so the user's logic is kept.
          items:
            type: string
          maxItems: 10
          type: array
        state_id:
          type: string
          description: "Continue from an earlier call's work: pass the state_id its result gave. Omit to start fresh."
      type: object
    output_schema:
      additionalProperties: false
      properties:
        project_name:
          type: string
        config_version:
          anyOf:
            - type: integer
            - type: "null"
        renderer:
          type: string
        main_scene:
          anyOf:
            - type: string
            - type: "null"
        scenes:
          items:
            additionalProperties: false
            properties:
              path:
                type: string
              root_type:
                type: string
              node_count:
                type: integer
              tree:
                items:
                  type: string
                type: array
            required:
              - path
              - root_type
              - node_count
            type: object
          type: array
        scripts:
          items:
            additionalProperties: false
            properties:
              path:
                type: string
              extends:
                anyOf:
                  - type: string
                  - type: "null"
              class_name:
                type: string
              methods:
                items:
                  type: string
                type: array
              signals:
                items:
                  type: string
                type: array
              exports:
                items:
                  type: string
                type: array
            required:
              - path
              - extends
              - methods
              - signals
              - exports
            type: object
          type: array
        input_actions:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
        autoloads:
          additionalProperties:
            type: string
          type: object
        file_count:
          type: integer
        file_contents:
          items:
            additionalProperties: false
            properties:
              path:
                type: string
              text:
                type: string
              lines:
                type: integer
              truncated:
                default: false
                type: boolean
            required:
              - path
              - text
              - lines
            type: object
          type: array
      required:
        - project_name
        - config_version
        - renderer
        - main_scene
        - scenes
        - scripts
        - input_actions
        - autoloads
        - file_count
      type: object
    long_running: false
    timeout_s: 90
    state_version: 1
  - name: playtest_game
    title: Play-test the game with simulated input
    kind: check
    description: "Use to check that gameplay works: runs the game in a virtual display at a fixed 30 fps and plays a scripted sequence in one call, with steps {action:'move_right', hold_ms}, {key:'Space'}, {click:[x,y]}, {wait_ms}, {screenshot:'name'}, {eval:'$Player.position'} to read live state, {assert:'score >= 1', label} and {wait_until:'expr', timeout_ms}. Returns each step's result, assertion pass/fail with values, screenshots and runtime errors. Project files stay unchanged. Call inspect_project first to find action names and node paths."
    input_schema:
      additionalProperties: false
      properties:
        project:
          format: skillnet-file
          type: string
          x-accept:
            - .zip
          description: A Godot 4 project zip to play-test (omit when passing a state_id).
        steps:
          description: The play-test script, run in order (up to 200 steps).
          items:
            additionalProperties: false
            properties:
              action:
                type: string
                description: Press an input action (e.g. move_right, jump) for hold_ms.
              key:
                type: string
                description: Press a keyboard key by name (A, Space, Enter, Escape, Left, Up, Shift...) for hold_ms.
              click:
                items:
                  type: number
                maxItems: 2
                minItems: 2
                type: array
                description: Click the mouse at [x, y] window pixels.
              button:
                default: left
                description: Mouse button for click.
                enum:
                  - left
                  - right
                  - middle
                type: string
              hold_ms:
                default: 100
                description: How long action/key/click is held, in game milliseconds.
                maximum: 30000
                minimum: 0
                type: integer
              wait_ms:
                maximum: 60000
                minimum: 0
                type: integer
                description: Let the game run this many game milliseconds with no input.
              screenshot:
                maxLength: 40
                type: string
                description: Take a screenshot with this name (letters, digits, - and _).
              eval:
                maxLength: 2000
                type: string
                description: GDScript expression to read live state, e.g. $Player.position or score; evaluated on the current scene root.
              assert:
                maxLength: 2000
                type: string
                description: GDScript expression that must be true, e.g. $Player.position.x > 600 or score >= 1.
              wait_until:
                maxLength: 2000
                type: string
                description: Wait until this expression is true (up to timeout_ms), e.g. score >= 1.
              timeout_ms:
                default: 5000
                description: Limit for wait_until, in game milliseconds.
                maximum: 60000
                minimum: 100
                type: integer
              label:
                maxLength: 120
                type: string
                description: A note shown with this step's result, e.g. 'player moved right'.
            type: object
          maxItems: 200
          minItems: 1
          type: array
        scene:
          type: string
          description: res:// scene to start in instead of the main scene.
        timeout_s:
          default: 120
          description: Real-time limit for the whole play-test, in seconds.
          maximum: 600
          minimum: 10
          type: integer
        width:
          maximum: 1920
          minimum: 160
          type: integer
          description: "Window width (default: the project's viewport width)."
        height:
          maximum: 1080
          minimum: 120
          type: integer
          description: "Window height (default: the project's viewport height)."
        state_id:
          type: string
          description: "Continue from an earlier call's work: pass the state_id its result gave. Omit to start fresh."
      required:
        - steps
      type: object
    output_schema:
      additionalProperties: false
      properties:
        steps_run:
          type: integer
        steps_total:
          type: integer
        assertions_passed:
          type: integer
        assertions_failed:
          type: integer
        step_errors:
          type: integer
        results:
          items:
            additionalProperties: false
            properties:
              index:
                type: integer
              step:
                type: string
              ok:
                type: boolean
              label:
                type: string
              value: {}
              error:
                type: string
              passed:
                type: boolean
            required:
              - index
              - step
              - ok
            type: object
          type: array
        runtime_errors:
          items:
            additionalProperties: false
            properties:
              message:
                type: string
              file:
                type: string
              line:
                type: integer
              function:
                type: string
              step:
                type: integer
            required:
              - message
            type: object
          type: array
        crashed:
          type: boolean
        screenshots:
          items:
            additionalProperties: false
            properties:
              t:
                type: number
              name:
                type: string
              file:
                type: string
              mean_color:
                type: string
              mean_rgb:
                items:
                  type: integer
                type: array
              dominant_color:
                description: Most common exact pixel colour, usually the background
                type: string
              dominant_share:
                description: Fraction of the frame that has the dominant colour
                type: number
              blank:
                type: boolean
            required:
              - file
              - mean_color
              - mean_rgb
              - dominant_color
              - dominant_share
              - blank
            type: object
          type: array
      required:
        - steps_run
        - steps_total
        - assertions_passed
        - assertions_failed
        - step_errors
        - results
        - runtime_errors
        - crashed
        - screenshots
      type: object
    long_running: true
    timeout_s: 660
    state_version: 1
  - name: run_game
    title: Run the game and capture what it shows
    kind: analyze
    description: "Use to see the game working (or crashing) with no input: runs the main scene, or a chosen scene, in a virtual display with the OpenGL software renderer at a fixed 30 fps for a set game time. Returns whether it crashed, runtime errors with file and line, screenshots at chosen moments (each with its mean colour, its dominant (background) colour and a blank-frame flag), a contact sheet, the console log and optionally an MP4. seconds=0.2 gives a still render of one scene. Use playtest_game when the game needs input."
    input_schema:
      additionalProperties: false
      properties:
        project:
          format: skillnet-file
          type: string
          x-accept:
            - .zip
          description: A Godot 4 project zip to run (omit when passing a state_id).
        scene:
          type: string
          description: res:// path of a scene to run instead of the main scene (e.g. to render one level or a UI screen).
        seconds:
          default: 5
          description: Game time to run, 0.2-60 s. Use 0.2 for a still render of a scene.
          maximum: 60
          minimum: 0.2
          type: number
        screenshot_at:
          items:
            type: number
          maxItems: 12
          type: array
          description: "Game-time moments (seconds) for screenshots, up to 12. Default: one at the end."
        record_video:
          default: false
          description: Also record an MP4 of the whole run (30 fps).
          type: boolean
        width:
          maximum: 1920
          minimum: 160
          type: integer
          description: "Window width in pixels (default: the project's viewport width)."
        height:
          maximum: 1080
          minimum: 120
          type: integer
          description: "Window height in pixels (default: the project's viewport height)."
        state_id:
          type: string
          description: "Continue from an earlier call's work: pass the state_id its result gave. Omit to start fresh."
      type: object
    output_schema:
      additionalProperties: false
      properties:
        scene:
          type: string
        started:
          type: boolean
        crashed:
          type: boolean
        finished:
          type: boolean
        exit_code:
          anyOf:
            - type: integer
            - type: "null"
        frames_rendered:
          type: integer
        runtime_errors:
          items:
            additionalProperties: false
            properties:
              message:
                type: string
              file:
                type: string
              line:
                type: integer
              function:
                type: string
              step:
                type: integer
            required:
              - message
            type: object
          type: array
        warnings:
          items:
            type: string
          type: array
        screenshots:
          items:
            additionalProperties: false
            properties:
              t:
                type: number
              name:
                type: string
              file:
                type: string
              mean_color:
                type: string
              mean_rgb:
                items:
                  type: integer
                type: array
              dominant_color:
                description: Most common exact pixel colour, usually the background
                type: string
              dominant_share:
                description: Fraction of the frame that has the dominant colour
                type: number
              blank:
                type: boolean
            required:
              - file
              - mean_color
              - mean_rgb
              - dominant_color
              - dominant_share
              - blank
            type: object
          type: array
        log_tail:
          type: string
      required:
        - scene
        - started
        - crashed
        - finished
        - exit_code
        - frames_rendered
        - runtime_errors
        - warnings
        - screenshots
        - log_tail
      type: object
    long_running: true
    timeout_s: 420
    state_version: 1
  - name: write_game_files
    title: Write or replace game scripts and scenes
    kind: edit
    description: "Use to add game logic or fix code that check_project flagged: writes GDScript (.gd), scenes (.tscn), resources (.tres), shaders or text files at res:// paths, changes lines in existing files with exact find/replace `edits` (keeps the rest of the user's code), can delete files, and compiles every written .gd with Godot 4.4 right away, returning syntax errors with line numbers. Also opens an uploaded project zip when there is no state_id yet. Returns the updated project zip and state_id; files are written even when they have errors, so fix and call again."
    input_schema:
      additionalProperties: false
      properties:
        project:
          format: skillnet-file
          type: string
          x-accept:
            - .zip
          description: An existing Godot 4 project as a zip, to open it when there is no state_id yet (replaces the state's project).
        files:
          description: "Files to write or replace (up to 50). Text files only: .gd, .tscn, .tres, .gdshader, .cfg, .json, .txt, .md, .csv, project.godot."
          items:
            additionalProperties: false
            properties:
              path:
                description: Project path starting with res://, e.g. res://scripts/enemy.gd or res://scenes/level.tscn.
                type: string
              content:
                description: The full text of the file (GDScript for .gd, Godot text scene format for .tscn).
                maxLength: 1000000
                type: string
            required:
              - path
              - content
            type: object
          maxItems: 50
          type: array
        delete:
          description: res:// paths of files to delete.
          items:
            type: string
          maxItems: 100
          type: array
        edits:
          description: "Small changes to existing files without rewriting them: [{path, find, replace}] exact-text replacements, applied in order. Use these to fix a line in the user's script and keep the rest of their…"
          items:
            additionalProperties: false
            properties:
              path:
                description: res:// path of an existing text file to change, e.g. res://scripts/main.gd.
                type: string
              find:
                description: Exact text to find (copy it from inspect_project read_files or a check_project error), e.g. 'onready var guard'.
                maxLength: 20000
                minLength: 1
                type: string
              replace:
                description: Text to put in its place (may be empty to delete it).
                maxLength: 200000
                type: string
              all:
                default: false
                description: Replace every occurrence; by default the text must occur exactly once.
                type: boolean
            required:
