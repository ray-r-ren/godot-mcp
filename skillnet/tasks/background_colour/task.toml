schema_version = "1.4"
source = "skillnet"
artifacts = ["/task/outputs", "/task/answer.txt"]

[task]
name = "skillnet/instant-game-studio-background_colour"
description = "Instant Game Studio — Run and see the game: Attached is my Godot 4 game \"Night Pond\" as a zip. I want my website to use exactly the same colour as the game's background (the sky behind the moon and lily p"
keywords = ["skillnet", "instant-game-studio", "run-and-see-the-game"]

[[task.authors]]
name = "SkillNet Agent"

[metadata]
[metadata.skillnet]
skill = "instant-game-studio"
version = 1
task = "background_colour"
ability = "Run and see the game"
core = true
source = "builder"
judge = "programmatic"
prompt = "Attached is my Godot 4 game \"Night Pond\" as a zip. I want my website to use exactly the same colour as the game's background (the sky behind the moon and lily pads, as it looks once the game is running).\n\nPlease run the game, take a screenshot, and tell me the background colour as a hex code. Put it on the last line of your answer like `Background: #RRGGBB`, and include the screenshot."

[agent]
timeout_sec = 900
user = "agent"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 6144
workdir = "/task"
network_mode = "allowlist"
allowed_hosts = ["skillnet.sh"]

[[environment.mcp_servers]]
name = "skillnet"
transport = "streamable-http"
url = "https://skillnet.sh/mcp"

[environment.mcp_servers.headers]
Authorization = "Bearer ${SKILLNET_API_KEY}"
