schema_version = "1.4"
source = "skillnet"
artifacts = ["/task/outputs", "/task/answer.txt"]

[task]
name = "skillnet/instant-game-studio-build_coin_collector"
description = "Instant Game Studio — Start and shape a game project: Make me a small top-down game called \"Coin Rush\" in Godot 4."
keywords = ["skillnet", "instant-game-studio", "start-and-shape-a-game-project"]

[[task.authors]]
name = "SkillNet Agent"

[metadata]
[metadata.skillnet]
skill = "instant-game-studio"
version = 3
task = "build_coin_collector"
ability = "Start and shape a game project"
core = true
source = "builder"
judge = "programmatic"
prompt = "Make me a small top-down game called \"Coin Rush\" in Godot 4.\n\n- I move a player square around with the arrow keys or WASD. Use the input action names move_left, move_right, move_up and move_down.\n- There are at least 5 coins to collect. Touching a coin removes it and adds 1 to a score shown on screen.\n- When the last coin is collected, show a message that says \"You win!\".\n\nSo I can test it myself:\n\n- put the player in a group called \"player\" and the coins in a group called \"coins\";\n- keep the score in a variable called `score` on the main scene's root node.\n\nPlay-test it to make sure moving, collecting and winning all work. Then give me the project as a zip."

[agent]
timeout_sec = 900
user = "agent"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 6144
workdir = "/task"
network_mode = "allowlist"
allowed_hosts = ["skillnet.sh"]

[[environment.mcp_servers]]
name = "skillnet"
transport = "streamable-http"
url = "https://skillnet.sh/mcp"

[environment.mcp_servers.headers]
Authorization = "Bearer ${SKILLNET_API_KEY}"
