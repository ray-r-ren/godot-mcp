schema_version = "1.4"
source = "skillnet"
artifacts = ["/task/outputs", "/task/answer.txt"]

[task]
name = "skillnet/instant-game-studio-find_errors_in_broken_project"
description = "Instant Game Studio — Check a project: My Godot 4 game \"Pixel Pond\" (zip attached) won't start and I'm not sure why. Don't change anything yet — I want to fix it myself."
keywords = ["skillnet", "instant-game-studio", "check-a-project"]

[[task.authors]]
name = "SkillNet Agent"

[metadata]
[metadata.skillnet]
skill = "instant-game-studio"
version = 3
task = "find_errors_in_broken_project"
ability = "Check a project"
core = true
source = "builder"
judge = "programmatic"
prompt = "My Godot 4 game \"Pixel Pond\" (zip attached) won't start and I'm not sure why. Don't change anything yet — I want to fix it myself.\n\nPlease check the whole project and tell me every problem you find: which file it's in, the line number when there is one, and what's wrong in plain words.\n\nAt the end of your answer, list each problem on its own line in this form:\n\n`ERROR: <file> line <number or -> — <what's wrong>`"

[agent]
timeout_sec = 900
user = "agent"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 6144
workdir = "/task"
network_mode = "allowlist"
allowed_hosts = ["skillnet.sh"]

[[environment.mcp_servers]]
name = "skillnet"
transport = "streamable-http"
url = "https://skillnet.sh/mcp"

[environment.mcp_servers.headers]
Authorization = "Bearer ${SKILLNET_API_KEY}"
