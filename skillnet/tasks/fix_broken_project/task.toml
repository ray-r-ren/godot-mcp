schema_version = "1.4"
source = "skillnet"
artifacts = ["/task/outputs", "/task/answer.txt"]

[task]
name = "skillnet/instant-game-studio-fix_broken_project"
description = "Instant Game Studio — Check a project: I'm moving my little Godot game \"Meadow Dash\" to Godot 4 and it's broken. It won't start, and there are errors everywhere."
keywords = ["skillnet", "instant-game-studio", "check-a-project"]

[[task.authors]]
name = "SkillNet Agent"

[metadata]
[metadata.skillnet]
skill = "instant-game-studio"
version = 3
task = "fix_broken_project"
ability = "Check a project"
core = true
source = "builder"
judge = "programmatic"
prompt = "I'm moving my little Godot game \"Meadow Dash\" to Godot 4 and it's broken. It won't start, and there are errors everywhere.\n\nHere's the project zip. Please fix it so that it runs in Godot 4.4 with no errors. It should still play the same way:\n\n- the player moves with the move_left / move_right / move_up / move_down actions;\n- touching a coin removes it and adds that coin's value to `score` on the main scene.\n\nThere's a reference to a music script that I never wrote. Just drop it.\n\nGive me back the fixed project as a zip and tell me what you changed."

[agent]
timeout_sec = 900
user = "agent"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 6144
workdir = "/task"
network_mode = "allowlist"
allowed_hosts = ["skillnet.sh"]

[[environment.mcp_servers]]
name = "skillnet"
transport = "streamable-http"
url = "https://skillnet.sh/mcp"

[environment.mcp_servers.headers]
Authorization = "Bearer ${SKILLNET_API_KEY}"
